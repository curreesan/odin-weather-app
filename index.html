<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="index.js" defer></script>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <title>Whats Your Weather</title>
  </head>
  <body>
    <div class="container">
      <header class="weather-input-container">
        <div class="weather-input-heading">What's Your Weather?</div>
        <form id="search-form">
          <input
            type="text"
            id="location-input"
            placeholder="Enter city..."
            required
          />
          <button type="submit">Search</button>
        </form>
      </header>

      <div id="loading" class="hidden">Loading...</div>
      <div id="error-message" class="hidden"></div>

      <section class="weather-details hidden" id="current-weather">
        <div id="city-name">Tokyo</div>
        <div id="temperature">29</div>
        <div id="date-time">07:00:00</div>
        <div id="condition">Partially cloudy</div>
        <div id="humidity">H: 67</div>
        <div id="forecast"></div>
      </section>
    </div>
  </body>
</html>
